<div id="notice" class="notice-region" aria-live="polite" aria-atomic="true">
{% if error %}<div class="notice notice-error" role="alert"><strong>요청을 처리하지 못했어요.</strong><span>{{ error }}</span></div>{% elif message %}<div class="notice notice-success" role="status">{{ message }}</div>{% endif %}
</div>
